repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2
          - httpx>=0.27
          - tenacity>=8
          - pytest>=8
          - python-dotenv>=1
          - click>=8
          - langchain-anthropic>=0.3
          - langchain-core>=0.3
          - langgraph>=0.2
          - langfuse>=2,<3
