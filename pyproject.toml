[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skeinminder"]

[project]
name = "skein-minder"
version = "0.1.0"
description = "Ravelry-powered multi-agent studio planner"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8",
    "fastapi>=0.110",
    "httpx>=0.27",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    "langfuse>=2,<3",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "tenacity>=8",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
skeinminder = "skeinminder.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = "langfuse.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "skeinminder.cli",
    "skeinminder.eval",
    "skeinminder.graph.nodes",
    "skeinminder.web.events",
    "skeinminder.web.server",
]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = [
    "eval: integration eval tests — require real LLM calls, excluded from CI",
]
